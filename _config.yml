resume_header_intro: "<p>I am a Ph.D. Candidate (from 2020.09) in the <a href='https://www.icip.org.cn/zh' target='_blank'>[Chinese Information Processing Laboratory]</a> at the Institute of Software, Chinese Academy of Sciences, under the supervision of Professor Xianpei Han and Professor Le Sun. I received my Bachelor degree in Nankai University in June 2020. My research interests include:</p><ul><li>Natural Language Processing</li><li>Knowledge injection and generalization in LLMs</li><li>Social Intelligence of LLMs</li></ul><p><strong>I am expected to graduate in 2026/06 and actively looking for job opportunities.</strong> I'd be happy to connect—feel free to reach out via the contact details below.</p> <p>Email: ruoxi2021@iscas.ac.cn</p> <p>Telephone: (+86) 15022171058</p> <p>Wechat: <img src='images/wechat.png' itemprop='image'></p>"

